const phaseLabels={"1.1":"Feasibility","1.2":"Permits & Agreements","1.3":"Engineering Design","1.4":"Construction","1.5":"Commissioning"};
const phaseColors={"1.1":"#3266ad","1.2":"#5ca87e","1.3":"#b87333","1.4":"#8e5cad","1.5":"#c05070"};
const critColor="#3266ad";
const nonCritColor="#5ca87e";

function render(){
  const pf=document.getElementById('filterPhase').value;
  const cf=document.getElementById('filterCritical').value;
  const showDeps=document.getElementById('showDeps').checked;
  const showSlack=document.getElementById('showSlack').checked;

  let vis=tasks.filter(t=>{
    if(pf&&!t.phase.startsWith(pf))return false;
    if(cf&&t.crit!==cf)return false;
    return true;
  });

  const rowH=22, labelW=220, headerH=36, padding=6;
  const totalW=window.innerWidth>900?window.innerWidth-60:900;
  const chartW=totalW-labelW;
  const maxT=60;
  const scaleX=t=>labelW+(t/maxT)*chartW;

  const svgH=headerH+vis.length*rowH+padding*2;
  const svg=document.getElementById('gantt');
  svg.setAttribute('width',totalW);
  svg.setAttribute('height',svgH);
  svg.setAttribute('viewBox',`0 0 ${totalW} ${svgH}`);

  let html='';

  // Phase color bands
  const phases=["1.1","1.2","1.3","1.4","1.5"];
  const phaseRanges={"1.1":[0,6],"1.2":[0,18],"1.3":[6,18],"1.4":[18,48],"1.5":[48,60]};
  phases.forEach(ph=>{
    const [s,e]=phaseRanges[ph];
    const col=phaseColors[ph]+'12';
    html+=`<rect x="${scaleX(s)}" y="${headerH}" width="${scaleX(e)-scaleX(s)}" height="${vis.length*rowH+padding}" fill="${col}" />`;
  });

  // Grid lines & month labels
  for(let m=0;m<=maxT;m+=2){
    const x=scaleX(m);
    html+=`<line x1="${x}" y1="${headerH}" x2="${x}" y2="${svgH}" stroke="#88888822" stroke-width="1"/>`;
    html+=`<text x="${x}" y="${headerH-6}" text-anchor="middle" font-size="10" fill="#888888" font-family="var(--font-sans)">M${m}</text>`;
  }
  // Phase headers
  phases.forEach(ph=>{
    const [s,e]=phaseRanges[ph];
    const cx=(scaleX(s)+scaleX(e))/2;
    html+=`<text x="${cx}" y="${headerH-20}" text-anchor="middle" font-size="10" font-weight="500" fill="${phaseColors[ph]}" font-family="var(--font-sans)">${phaseLabels[ph]}</text>`;
  });

  // Deps
  if(showDeps){
    vis.forEach((t,ri)=>{
      t.preds.forEach(pid=>{
        const pt=tasks.find(x=>x.id===pid);
        if(!pt)return;
        const pvi=vis.findIndex(x=>x.id===pid);
        if(pvi<0)return;
        const x1=scaleX(pt.EF);
        const y1=headerH+pvi*rowH+rowH/2;
        const x2=scaleX(t.ES);
        const y2=headerH+ri*rowH+rowH/2;
        const mx=(x1+x2)/2;
        html+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" stroke="#3266ad44" fill="none" stroke-width="1" stroke-dasharray="3,2"/>`;
        html+=`<polygon points="${x2},${y2} ${x2-4},${y2-3} ${x2-4},${y2+3}" fill="#3266ad66"/>`;
      });
    });
  }

  // Bars
  vis.forEach((t,i)=>{
    const y=headerH+i*rowH;
    const barY=y+3;
    const barH=rowH-6;

    // Slack bar
    if(showSlack&&t.slack>0){
      html+=`<rect x="${scaleX(t.EF)}" y="${barY}" width="${scaleX(t.LF)-scaleX(t.EF)}" height="${barH}" rx="2" fill="rgba(50,102,173,0.12)" stroke="#3266ad" stroke-width="0.5" stroke-dasharray="3,2"/>`;
    }

    // Row bg alternating
    html+=`<rect x="0" y="${y}" width="${totalW}" height="${rowH}" fill="${i%2===0?'transparent':'rgba(128,128,128,0.04)'}"/>`;

    // Label
    const shortDesc=t.desc.length>32?t.desc.slice(0,30)+'…':t.desc;
    html+=`<text x="4" y="${y+rowH/2+4}" font-size="10.5" fill="${t.crit==='Yes'?'var(--color-text-primary)':'var(--color-text-secondary)'}" font-weight="${t.crit==='Yes'?'500':'400'}" font-family="var(--font-sans)">${t.id} ${shortDesc}</text>`;

    // Bar
    if(t.milestone){
      const mx=scaleX((t.ES+t.EF)/2);
      const my=y+rowH/2;
      html+=`<polygon points="${mx},${my-7} ${mx+7},${my} ${mx},${my+7} ${mx-7},${my}" fill="#d85a30" class="bar" data-id="${t.id}"/>`;
    } else {
      const bx=scaleX(t.ES);
      const bw=Math.max(scaleX(t.EF)-scaleX(t.ES),2);
      const col=t.crit==='Yes'?critColor:nonCritColor;
      html+=`<rect x="${bx}" y="${barY}" width="${bw}" height="${barH}" rx="2" fill="${col}" opacity="0.85" class="bar" data-id="${t.id}"/>`;
    }
  });

  // Today line placeholder (M-0)
  html+=`<line x1="${scaleX(0)}" y1="${headerH}" x2="${scaleX(0)}" y2="${svgH}" stroke="#d85a30" stroke-width="1.5" stroke-dasharray="4,3"/>`;

  svg.innerHTML=html;

  // Tooltip
  svg.querySelectorAll('.bar').forEach(el=>{
    el.style.cursor='pointer';
    el.addEventListener('mouseenter',function(e){
      const id=this.getAttribute('data-id');
      const t=tasks.find(x=>x.id===id);
      if(!t)return;
      const tt=document.getElementById('tt');
      tt.innerHTML=`<strong>${t.id}</strong><br>${t.desc}<br>ES: M${t.ES} → EF: M${t.EF}<br>Duration: ${t.dur} months<br>Slack: ${t.slack} months<br>Critical: ${t.crit}`;
      tt.style.display='block';
    });
    el.addEventListener('mousemove',function(e){
      const tt=document.getElementById('tt');
      tt.style.left=(e.pageX+12)+'px';
      tt.style.top=(e.pageY-10)+'px';
    });
    el.addEventListener('mouseleave',function(){
      document.getElementById('tt').style.display='none';
    });
  });
}

document.getElementById('filterPhase').addEventListener('change',render);
document.getElementById('filterCritical').addEventListener('change',render);
document.getElementById('showDeps').addEventListener('change',render);
document.getElementById('showSlack').addEventListener('change',render);
window.addEventListener('resize',render);
render();
</script>
